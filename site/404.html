<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #111827; color: #f9fafb; }
      main { width: min(560px, calc(100% - 40px)); }
      p { color: #b8c0cc; line-height: 1.7; }
      a { color: #b7b6ff; font-weight: 700; }
      code { padding: .15em .35em; background: #252b38; border-radius: .35em; }
    </style>
  </head>
  <body>
    <main>
      <p><code>404</code></p>
      <h1>Page not found</h1>
      <p>指定されたプレビューページは現在の公開構成にありません。</p>
      <p><a href="./">現在のディレクトリへ戻る</a></p>
    </main>
  </body>
</html>
